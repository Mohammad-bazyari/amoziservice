<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="تعمیر پکیج شاپه در ایران">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="90" cy="80" r="46"/>
    <circle cx="560" cy="300" r="60"/>
    <path d="M480 50 l26 26 M506 50 l-26 26"/>
  </g>
  <!-- boiler silhouette -->
  <rect x="140" y="70" width="170" height="230" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="160" y="95" width="130" height="62" rx="9" fill="#0c4a6e"/>
  <text x="225" y="138" font-family="monospace" font-size="26" font-weight="bold" fill="#f87171" text-anchor="middle">Er</text>
  <circle cx="180" cy="200" r="12" fill="#fbbf24"/>
  <circle cx="270" cy="200" r="12" fill="#e2e8f0"/>
  <rect x="160" y="248" width="130" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="160" y="272" width="90" height="10" rx="5" fill="#cbd5e1"/>
  <!-- Korea tag -->
  <g transform="translate(360 110)">
    <rect x="0" y="0" width="150" height="64" rx="12" fill="#ffffff"/>
    <text x="75" y="28" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Korea</text>
    <text x="75" y="50" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Navien Group</text>
  </g>
  <!-- rare parts icon: puzzle-ish blocks -->
  <g transform="translate(368 220)">
    <rect x="0" y="0" width="46" height="46" rx="8" fill="#fbbf24" opacity="0.92"/>
    <rect x="58" y="0" width="46" height="46" rx="8" fill="#ffffff" opacity="0.55"/>
    <rect x="29" y="58" width="46" height="46" rx="8" fill="#ffffff" opacity="0.55"/>
    <rect x="87" y="58" width="46" height="46" rx="8" fill="#fbbf24" opacity="0.92"/>
  </g>
</svg>
