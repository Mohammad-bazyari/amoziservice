<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="صدای غیرعادی و افت فشار پکیج">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="60" y="60" width="90" height="240" rx="14"/>
    <rect x="500" y="100" width="80" height="160" rx="12"/>
  </g>
  <!-- pump body -->
  <circle cx="320" cy="180" r="78" fill="#ffffff" opacity="0.95"/>
  <circle cx="320" cy="180" r="52" fill="none" stroke="#4c1d95" stroke-width="8"/>
  <circle cx="320" cy="180" r="14" fill="#4c1d95"/>
  <g stroke="#4c1d95" stroke-width="8" stroke-linecap="round">
    <line x1="320" y1="140" x2="320" y2="158"/>
    <line x1="320" y1="202" x2="320" y2="220"/>
    <line x1="280" y1="180" x2="298" y2="180"/>
    <line x1="342" y1="180" x2="360" y2="180"/>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round">
    <path d="M446 120a86 86 0 0 1 0 120"/>
    <path d="M476 96a124 124 0 0 1 0 168"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85">
